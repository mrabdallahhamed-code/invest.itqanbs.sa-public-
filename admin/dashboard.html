<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
  <button class="btn ghost" onclick="signOut()">تسجيل الخروج</button>
</header>
<main>
  <h1 class="page-title">مركز التحقق والإدارة</h1>

  <div class="tabs">
    <button class="active" onclick="switchTab('docs')">مستندات العملاء</button>
    <button onclick="switchTab('clients')">تصنيف العملاء والإجراءات</button>
    <button onclick="switchTab('requests')">توجيه طلبات العروض</button>
    <button onclick="switchTab('providerDocs')">مستندات مقدمي الخدمة</button>
    <button onclick="switchTab('providers')">مقدمو الخدمة</button>
  </div>

  <div id="tab-docs">
    <div class="card">
      <table>
        <thead><tr><th>العميل</th><th>المستند</th><th>التاريخ</th><th>إجراء</th></tr></thead>
        <tbody id="docsBody"><tr><td colspan="4">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-clients" style="display:none;">
    <div class="card">
      <table>
        <thead><tr><th>العميل</th><th>الجنسية</th><th>الحالة الحالية</th><th>تحديث التصنيف</th><th>الإجراءات</th></tr></thead>
        <tbody id="clientsBody"><tr><td colspan="5">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-requests" style="display:none;">
    <div class="card">
      <h3 style="margin-bottom:12px;">طلبات بانتظار التوجيه</h3>
      <div id="requestsBody"><p style="font-size:13.5px;color:var(--ink-soft);">جارٍ التحميل...</p></div>
    </div>
  </div>

  <div id="tab-providerDocs" style="display:none;">
    <div class="card">
      <table>
        <thead><tr><th>مقدّم الخدمة</th><th>المستند</th><th>التاريخ</th><th>إجراء</th></tr></thead>
        <tbody id="providerDocsBody"><tr><td colspan="4">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-providers" style="display:none;">
    <div class="card">
      <table>
        <thead><tr><th>اسم الشركة</th><th>التخصص</th><th>الحالة</th><th>إجراء</th></tr></thead>
        <tbody id="providersBody"><tr><td colspan="4">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

function switchTab(tab){
  document.getElementById('tab-docs').style.display = tab==='docs' ? 'block':'none';
  document.getElementById('tab-clients').style.display = tab==='clients' ? 'block':'none';
  document.getElementById('tab-requests').style.display = tab==='requests' ? 'block':'none';
  document.getElementById('tab-providerDocs').style.display = tab==='providerDocs' ? 'block':'none';
  document.getElementById('tab-providers').style.display = tab==='providers' ? 'block':'none';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(tab==='requests') loadPendingRequests();
  if(tab==='providerDocs') loadProviderDocs();
  if(tab==='providers') loadProviders();
}

async function loadProviders(){
  const { data, error } = await supabase
    .from('service_providers')
    .select('id, company_name, specialty, is_verified')
    .order('company_name');

  const body = document.getElementById('providersBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="4">لا يوجد مقدمو خدمة مسجلون بعد</td></tr>'; return; }

  body.innerHTML = data.map(p => `
    <tr>
      <td>${p.company_name}</td>
      <td>${p.specialty || '—'}</td>
      <td>${p.is_verified ? '<span class="badge ready">معتمد ✓</span>' : '<span class="badge pending">غير معتمد</span>'}</td>
      <td>
        <a href="provider-detail.html?id=${p.id}" class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;">عرض الملف الكامل</a>
      </td>
    </tr>`).join('');
}

async function toggleProviderVerification(providerId, verify){
  const { error } = await supabase.from('service_providers').update({ is_verified: verify }).eq('id', providerId);
  if(error){ alert(error.message); return; }
  loadProviders();
}

async function loadProviderDocs(){
  const { data, error } = await supabase
    .from('provider_documents')
    .select('id, doc_type, uploaded_at, status, provider_id, service_providers(company_name)')
    .eq('status', 'pending')
    .order('uploaded_at');

  const body = document.getElementById('providerDocsBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="4">لا توجد مستندات بانتظار المراجعة</td></tr>'; return; }

  body.innerHTML = data.map(d => `
    <tr>
      <td>${d.service_providers?.company_name || d.provider_id}</td>
      <td>${d.doc_type}</td>
      <td>${new Date(d.uploaded_at).toLocaleDateString('ar-SA')}</td>
      <td>
        <button class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="reviewProviderDoc('${d.id}','verified')">اعتماد</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="reviewProviderDoc('${d.id}','rejected')">رفض</button>
      </td>
    </tr>`).join('');
}

async function reviewProviderDoc(id, status){
  const { error } = await supabase.from('provider_documents').update({
    status, reviewed_by: profile.id, reviewed_at: new Date().toISOString()
  }).eq('id', id);
  if(error){ alert(error.message); return; }
  loadProviderDocs();
}

async function init(){
  profile = await requireRole(['admin']);
  if(!profile) return;
  loadDocs();
  loadClients();
}

async function loadDocs(){
  const { data, error } = await supabase
    .from('documents')
    .select('id, doc_type, uploaded_at, status, file_path, client_id, clients(id, profiles(full_name))')
    .eq('status', 'pending')
    .order('uploaded_at');

  const body = document.getElementById('docsBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="4">لا توجد مستندات بانتظار المراجعة</td></tr>'; return; }

  body.innerHTML = data.map(d => `
    <tr>
      <td>${d.clients?.profiles?.full_name || d.client_id}</td>
      <td>${d.doc_type}</td>
      <td>${new Date(d.uploaded_at).toLocaleDateString('ar-SA')}</td>
      <td>
        <button class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="reviewDoc('${d.id}','verified')">اعتماد</button>
        <button class="btn ghost" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="reviewDoc('${d.id}','rejected')">رفض</button>
      </td>
    </tr>`).join('');
}

async function reviewDoc(id, status){
  const { error } = await supabase.from('documents').update({
    status, reviewed_by: profile.id, reviewed_at: new Date().toISOString()
  }).eq('id', id);
  if(error){ alert(error.message); return; }
  loadDocs();
}

async function loadClients(){
  const { data, error } = await supabase
    .from('clients')
    .select('id, nationality, readiness_status, profiles(full_name)')
    .order('created_at', {ascending:false});

  const body = document.getElementById('clientsBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="5">لا يوجد عملاء بعد</td></tr>'; return; }

  const statusMap = {pending_review:'قيد المراجعة', ready:'جاهز', not_ready:'غير جاهز'};

  body.innerHTML = data.map(c => `
    <tr>
      <td>${c.profiles?.full_name || c.id}</td>
      <td>${c.nationality || '—'}</td>
      <td>${statusMap[c.readiness_status]}</td>
      <td>
        <select onchange="updateReadiness('${c.id}', this.value)" style="width:auto;padding:5px 8px;">
          <option value="">تغيير إلى...</option>
          <option value="ready">جاهز</option>
          <option value="not_ready">غير جاهز</option>
          <option value="pending_review">قيد المراجعة</option>
        </select>
      </td>
      <td>
        <a href="client-detail.html?id=${c.id}" class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;">عرض الملف الكامل</a>
      </td>
    </tr>`).join('');
}

async function updateReadiness(clientId, status){
  if(!status) return;
  const { error } = await supabase.from('clients').update({ readiness_status: status }).eq('id', clientId);
  if(error){ alert(error.message); return; }
  loadClients();
}

function toggleChecklist(clientId){
  const row = document.getElementById(`checklist-row-${clientId}`);
  const isHidden = row.style.display === 'none';
  row.style.display = isHidden ? 'table-row' : 'none';
  if(isHidden) loadChecklistItems(clientId);
}

async function loadChecklistItems(clientId){
  const { data, error } = await supabase.from('readiness_checklist').select('*').eq('client_id', clientId).order('updated_at');
  const container = document.getElementById(`checklist-items-${clientId}`);
  if(error || !data || !data.length){
    container.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">لا توجد إجراءات مضافة بعد.</p>';
    return;
  }
  container.innerHTML = data.map(item => `
    <div style="display:flex;align-items:center;gap:10px;padding:6px 0;">
      <input type="checkbox" ${item.is_complete ? 'checked' : ''} onchange="toggleItem('${item.id}', this.checked, '${clientId}')">
      <span style="font-size:13.5px;${item.is_complete ? 'color:var(--ink-soft);text-decoration:line-through;' : ''}">${item.item}</span>
    </div>
  `).join('');
}

async function addChecklistItem(clientId){
  const input = document.getElementById(`new-item-${clientId}`);
  const text = input.value.trim();
  if(!text) return;
  const { error } = await supabase.from('readiness_checklist').insert({ client_id: clientId, item: text });
  if(error){ alert(error.message); return; }
  input.value = '';
  loadChecklistItems(clientId);
}

async function toggleItem(itemId, isComplete, clientId){
  const { error } = await supabase.from('readiness_checklist').update({ is_complete: isComplete, updated_at: new Date().toISOString() }).eq('id', itemId);
  if(error){ alert(error.message); return; }
  loadChecklistItems(clientId);
}

// ---------- توجيه طلبات العروض ----------
async function loadPendingRequests(){
  const body = document.getElementById('requestsBody');
  const { data: requests, error } = await supabase
    .from('service_requests')
    .select('id, created_at, client_id, clients(readiness_status, profiles(full_name))')
    .eq('status', 'pending_admin_review')
    .order('created_at');

  if(error){ body.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!requests || !requests.length){ body.innerHTML = '<p style="font-size:13.5px;color:var(--ink-soft);">لا توجد طلبات بانتظار التوجيه حالياً.</p>'; return; }

  const { data: providers } = await supabase.from('service_providers').select('id, company_name, specialty').eq('is_verified', true);
  const providerList = providers || [];
  const statusMap = {ready:'جاهز', not_ready:'غير جاهز', pending_review:'قيد المراجعة'};

  body.innerHTML = requests.map(r => `
    <div style="border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;">
      <p style="font-size:14px;margin-bottom:4px;"><strong>${r.clients?.profiles?.full_name || r.client_id}</strong></p>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;">حالة العميل: ${statusMap[r.clients?.readiness_status] || '—'} · تاريخ الطلب: ${new Date(r.created_at).toLocaleDateString('ar-SA')}</p>
      <p style="font-size:13px;font-weight:700;margin-bottom:8px;">اختر مقدمي الخدمة لتوجيه الطلب إليهم:</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;" id="providers-${r.id}">
        ${providerList.length ? providerList.map(p => `
          <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;">
            <input type="checkbox" value="${p.id}"> ${p.company_name} ${p.specialty ? '— ' + p.specialty : ''}
          </label>
        `).join('') : '<p style="font-size:13px;color:var(--ink-soft);">لا يوجد مقدمو خدمة معتمدون حالياً.</p>'}
      </div>
      <button class="btn" style="padding:8px 18px;font-size:13px;" onclick="routeRequest('${r.id}')">توجيه الطلب</button>
      <div id="routeMsg-${r.id}"></div>
    </div>
  `).join('');
}

async function routeRequest(requestId){
  const container = document.getElementById(`providers-${requestId}`);
  const checked = [...container.querySelectorAll('input[type=checkbox]:checked')].map(cb => cb.value);
  const msg = document.getElementById(`routeMsg-${requestId}`);

  if(!checked.length){ msg.className='msg err'; msg.textContent='اختر مقدّم خدمة واحداً على الأقل'; return; }

  const rows = checked.map(providerId => ({ request_id: requestId, provider_id: providerId }));
  const { error: invErr } = await supabase.from('request_invitations').insert(rows);
  if(invErr){ msg.className='msg err'; msg.textContent = invErr.message; return; }

  const { error: reqErr } = await supabase.from('service_requests').update({ status: 'open' }).eq('id', requestId);
  if(reqErr){ msg.className='msg err'; msg.textContent = reqErr.message; return; }

  msg.className='msg ok'; msg.textContent='تم توجيه الطلب بنجاح';
  setTimeout(loadPendingRequests, 1000);
}

init();
</script>
</body>
</html>
