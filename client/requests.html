<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات التأسيس — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
    <nav>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> نظرة عامة</a>
      <a href="assessment.html" class="side-link"><span class="ic">📝</span> تقييم الجاهزية</a>
      <div class="side-group-label">الطلبات</div>
      <a href="requests.html" class="side-link sub active"><span class="ic">🏢</span> طلبات التأسيس</a>
      <a href="post-incorp.html" class="side-link sub"><span class="ic">🗂️</span> طلبات بعد التأسيس</a>
      <a href="journey.html" class="side-link sub"><span class="ic">🛤️</span> رحلة الطلب</a>
      <a href="offers.html" class="side-link sub"><span class="ic">💰</span> العروض</a>
      <a href="profile.html" class="side-link"><span class="ic">👤</span> بياناتي</a>
      <a href="files.html" class="side-link"><span class="ic">📁</span> ملفاتي</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn ghost" style="width:100%;margin:0;" onclick="signOut()">تسجيل الخروج</button>
    </div>
  </aside>

  <div style="flex:1;display:flex;flex-direction:column;">
    <header class="app-topbar">
      <a class="topbar-btn" href="https://wa.me/966569051686" target="_blank" title="تواصل معنا">💬</a>
      <button class="topbar-btn" id="langToggleBtn" onclick="toggleLang()">EN</button>
      <div id="notifBellContainer"></div>
    </header>
    <main class="app-main">
      <div class="app-main-inner">
        <h1 class="page-title">طلبات التأسيس</h1>
        <div class="card" id="reqArea"><p style="color:var(--ink-soft);font-size:13.5px;">جارٍ التحميل...</p></div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  initNotificationBell(profile.id);
  loadRequest();
}

function handleOffersClick(activeRequest, assessmentDone){
  if(activeRequest){
    const statusLabels = {
      pending_admin_review: 'قيد المراجعة — بانتظار توجيه فريق إتقان',
      open: 'تم توجيه طلبك — بانتظار عروض من مقدمي الخدمة',
      offer_selected: 'تم اختيار عرض بالفعل',
      in_progress: 'قيد التنفيذ', completed: 'مكتمل', cancelled: 'ملغى'
    };
    alert('لديك طلب بالفعل: ' + (statusLabels[activeRequest.status] || 'بانتظار التوجيه'));
    return;
  }
  if(!assessmentDone){ alert('فضلاً أكمل تقييم الجاهزية أولاً للحصول على عروض.'); return; }
  window.location.href = 'request-offers.html';
}

async function loadRequest(){
  const area = document.getElementById('reqArea');
  const { data: client } = await supabase.from('clients').select('assessment_completed_at').eq('id', profile.id).single();

  const { data: requests, error } = await supabase
    .from('service_requests')
    .select('*')
    .eq('client_id', profile.id)
    .order('created_at', {ascending:false})
    .limit(1);

  if(error){ area.innerHTML = `<p class="msg err">${error.message}</p>`; return; }

  const activeRequest = requests && requests.length ? requests[0] : null;
  window.handleOffersClickBound = () => handleOffersClick(activeRequest, !!client?.assessment_completed_at);

  if(!activeRequest){
    area.innerHTML = `
      <p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:16px;">ما عندك طلب تأسيس حالياً.</p>
      <button class="btn gold" onclick="handleOffersClickBound()">الحصول على عروض</button>
    `;
    return;
  }

  const statusMap = {
    pending_admin_review: 'قيد المراجعة — فريق إتقان يحدد مقدمي الخدمة المناسبين',
    open: 'مفتوح — بانتظار عروض من مقدمي الخدمة',
    offer_selected: 'تم اختيار عرض',
    in_progress: 'قيد التنفيذ', completed: 'مكتمل', cancelled: 'ملغى'
  };

  let html = `<p style="font-size:13.5px;margin-bottom:10px;">حالة الطلب: <strong>${statusMap[activeRequest.status] || activeRequest.status}</strong></p>`;
  html += `<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;">النشاط: ${activeRequest.activity_type || '—'}</p>`;
  html += `<a href="offers.html" class="btn ghost" style="margin-left:8px;">عرض العروض الواردة</a>`;
  html += `<a href="journey.html" class="btn ghost">متابعة رحلة الطلب</a>`;

  area.innerHTML = html;
}

init();
</script>
</body>
</html>
