<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقييم الجاهزية — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .q-card{max-width:540px;margin:50px auto;}
  .q-text{font-size:17px;color:var(--green-dark);font-weight:700;margin-bottom:20px;line-height:1.6;}
  .q-sub{font-size:12.5px;color:var(--ink-soft);margin-top:-14px;margin-bottom:18px;}
  .q-options{display:flex;gap:12px;}
  .q-options button{flex:1;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:.15s;}
  .q-options button:hover{border-color:var(--gold);background:var(--green-tint);}
  .progress{display:flex;gap:6px;margin-bottom:30px;justify-content:center;flex-wrap:wrap;}
  .progress span{width:22px;height:4px;border-radius:2px;background:var(--line);}
  .progress span.done{background:var(--gold);}
  .doc-upload-row{border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .doc-upload-row.uploaded{border-color:var(--green);background:var(--green-tint);}
  .doc-upload-row h4{font-size:13.5px;margin-bottom:8px;}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div></header>
<main>
  <div class="card q-card" id="qCard">
    <div class="progress" id="progressBar"></div>
    <div id="qBody"><p style="text-align:center;color:var(--ink-soft);">جارٍ التحميل...</p></div>
  </div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;
let answers = {};

const questions = [
  { key: 'has_foreign_company', text: 'هل تمتلك شركة خارجية حالياً؟' },
  { key: 'is_llc', text: 'هل الشركة ذات مسؤولية محدودة (LLC)؟' },
  { key: 'has_incorporation_contract', text: 'هل تمتلك عقد تأسيس ساري للشركة؟' },
  { key: 'has_audited_financials', text: 'هل لديك قوائم مالية مدققة لمدة عام على الأقل؟' },
];

const journeySteps = [
  'تصديق الوثائق من السفارة السعودية بالبلد الأم',
  'شحن الوثائق',
  'التقديم على رخصة الاستثمار',
  'الحصول على رخصة الاستثمار',
  'حجز الاسم التجاري',
  'تأسيس الشركة وعقد التأسيس',
  'فتح ملف الموارد البشرية',
  'فتح الملفات الحكومية',
];

const requiredDocTypes = ['عقد التأسيس (الشركة الأم)', 'جواز سفر ممثل الشركة', 'السجل التجاري الأجنبي'];
const uploadedFiles = {};

let currentStep = 0;
let totalSteps = questions.length;

async function init(){
  profile = await requireRole(['client']);
  if(!profile) return;
  renderQuestion();
}

function renderProgress(){
  document.getElementById('progressBar').innerHTML =
    Array.from({length: totalSteps}, (_,i) => `<span class="${i < currentStep ? 'done' : ''}"></span>`).join('');
}

function renderQuestion(){
  renderProgress();
  const q = questions[currentStep];
  document.getElementById('qBody').innerHTML = `
    <div class="q-text">${q.text}</div>
    <div class="q-options">
      <button onclick="answer(true)">نعم</button>
      <button onclick="answer(false)">لا</button>
    </div>`;
}

function answer(value){
  const q = questions[currentStep];
  answers[q.key] = value;

  if(q.key === 'has_foreign_company' && value === false){
    totalSteps = questions.length + 1;
    currentStep = questions.length;
    renderPreferredCountryStep();
    return;
  }

  currentStep++;
  if(currentStep >= questions.length){
    totalSteps = questions.length + 2 + requiredDocTypes.length;
    renderCompanyNameStep();
  } else {
    renderQuestion();
  }
}

function renderPreferredCountryStep(){
  renderProgress();
  document.getElementById('qBody').innerHTML = `
    <div class="q-text">من أي دولة تفضل أن تكون شركتك الخارجية؟</div>
    <p class="q-sub">بما إنك لا تملك شركة خارجية حالياً، سيقوم فريق إتقان بتوفير شركة مناسبة لك ضمن العروض القادمة.</p>
    <input id="countryInput" placeholder="مثال: الإمارات، مصر، بريطانيا...">
    <button class="btn gold" style="width:100%;margin-top:16px;" onclick="savePreferredCountry()">متابعة</button>`;
}

function savePreferredCountry(){
  answers.preferred_company_country = document.getElementById('countryInput').value.trim();
  currentStep++;
  finish();
}

function renderCompanyNameStep(){
  currentStep++;
  renderProgress();
  document.getElementById('qBody').innerHTML = `
    <div class="q-text">ما اسم شركتك الأجنبية؟</div>
    <input id="companyNameInput" placeholder="اسم الشركة">
    <button class="btn gold" style="width:100%;margin-top:16px;" onclick="saveCompanyName()">متابعة</button>`;
}

function saveCompanyName(){
  answers.foreign_company_name = document.getElementById('companyNameInput').value.trim();
  renderCompanyCountryStep();
}

function renderCompanyCountryStep(){
  currentStep++;
  renderProgress();
  document.getElementById('qBody').innerHTML = `
    <div class="q-text">في أي دولة الشركة مسجّلة؟</div>
    <input id="companyCountryInput" placeholder="مثال: الإمارات، مصر، بريطانيا...">
    <button class="btn gold" style="width:100%;margin-top:16px;" onclick="saveCompanyCountry()">متابعة</button>`;
}

function saveCompanyCountry(){
  answers.foreign_company_country = document.getElementById('companyCountryInput').value.trim();
  renderDocsStep();
}

function renderDocsStep(){
  currentStep++;
  renderProgress();
  document.getElementById('qBody').innerHTML = `
    <div class="q-text">ارفع مستندات شركتك الخارجية</div>
    <p class="q-sub">هذي المستندات تساعد فريق إتقان يراجع ملفك بدقة أكبر.</p>
    <div id="docUploadRows"></div>
    <button class="btn gold" style="width:100%;margin-top:10px;" onclick="finish()">إنهاء التقييم</button>
    <p style="text-align:center;font-size:12px;color:var(--ink-soft);margin-top:8px;">يمكنك رفع المستندات لاحقاً من لوحتك إن أحببت</p>`;

  const rows = document.getElementById('docUploadRows');
  requiredDocTypes.forEach((docType, i) => {
    const row = document.createElement('div');
    row.className = 'doc-upload-row';
    row.id = `docrow-${i}`;
    row.innerHTML = `<h4>${docType}</h4><input type="file" onchange="handleDocFile(${i}, '${docType}', this)">`;
    rows.appendChild(row);
  });
}

function handleDocFile(index, docType, input){
  if(!input.files.length) return;
  uploadedFiles[index] = { docType, file: input.files[0] };
  document.getElementById(`docrow-${index}`).classList.add('uploaded');
}

async function finish(){
  document.getElementById('qBody').innerHTML = '<p style="text-align:center;color:var(--ink-soft);">جارٍ حفظ النتيجة...</p>';

  let readiness_status, readiness_notes;
  const checklistItems = [];

  if(answers.has_foreign_company === false){
    readiness_status = 'not_ready';
    readiness_notes = 'لا تمتلك شركة أجنبية حالياً — سيقوم فريق إتقان بتوفير شركة مناسبة لك، ويمكنك طلب العروض مباشرة.';
  } else {
    if(answers.is_llc && answers.has_incorporation_contract && answers.has_audited_financials){
      readiness_status = 'ready';
      readiness_notes = null;
    } else {
      readiness_status = 'not_ready';
      if(!answers.is_llc) checklistItems.push('تعديل الشكل القانوني للشركة ليصبح ذا مسؤولية محدودة (LLC)');
      if(!answers.has_incorporation_contract) checklistItems.push('استخراج أو تجهيز عقد تأسيس ساري للشركة');
      if(!answers.has_audited_financials) checklistItems.push('إعداد قوائم مالية مدققة لمدة عام على الأقل');
      readiness_notes = 'ملفك يحتاج بعض النقاط قبل التأسيس — راجع مراحل التنفيذ بلوحتك.';
    }
    checklistItems.push(...journeySteps);
  }

  const payload = {
    id: profile.id,
    has_foreign_company: answers.has_foreign_company,
    is_llc: answers.is_llc ?? null,
    has_incorporation_contract: answers.has_incorporation_contract ?? null,
    has_audited_financials: answers.has_audited_financials ?? null,
    foreign_company_name: answers.foreign_company_name || null,
    foreign_company_country: answers.foreign_company_country || null,
    preferred_company_country: answers.preferred_company_country || null,
    assessment_completed_at: new Date().toISOString(),
    readiness_status,
    readiness_notes
  };

  const { error } = await supabase.from('clients').upsert(payload);
  if(error){
    document.getElementById('qBody').innerHTML = `<p class="msg err">${error.message}</p>`;
    return;
  }

  if(checklistItems.length){
    const rows = checklistItems.map((item, i) => ({ client_id: profile.id, item, position: i }));
    await supabase.from('readiness_checklist').insert(rows);
  }

  for(const key in uploadedFiles){
    const { docType, file } = uploadedFiles[key];
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const filePath = `${profile.id}/${Date.now()}_${safeName}`;
    const { error: upErr } = await supabase.storage.from('client-documents').upload(filePath, file);
    if(!upErr){
      await supabase.from('documents').insert({ client_id: profile.id, doc_type: docType, file_path: filePath });
    }
  }

  window.location.href = 'dashboard.html';
}

init();
</script>
</body>
</html>
