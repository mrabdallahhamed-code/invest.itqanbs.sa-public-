<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقديم عرض — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top"><div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div></header>
<main style="max-width:640px;">
  <a href="dashboard.html" style="font-size:13px;color:var(--ink-soft);text-decoration:none;">← رجوع للوحة الرئيسية</a>
  <h1 class="page-title" style="margin-top:10px;">تقديم عرض تفصيلي</h1>

  <div class="card">
    <h3 style="margin-bottom:14px;">تفصيل السعر</h3>
    <label>تكلفة الاستحواذ (إن وجدت)</label>
    <input id="acquisition_cost" type="number" placeholder="0">
    <label>تكلفة الخدمات الحكومية</label>
    <input id="government_services_cost" type="number" placeholder="0">
    <label>تكلفة الترخيص</label>
    <input id="licensing_cost" type="number" placeholder="0">
    <label>تكاليف أخرى</label>
    <input id="other_costs" type="number" placeholder="0">
    <p style="margin-top:14px;font-size:14px;font-weight:700;color:var(--green-dark);">الإجمالي: <span id="totalPrice">0</span> ر.س</p>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px;">شروط التنفيذ</h3>
    <label>مدة التنفيذ (بالأيام)</label>
    <input id="duration_days" type="number" placeholder="مثال: 15">

    <label>وسيلة الدفع</label>
    <select id="payment_method">
      <option value="">اختر...</option>
      <option>تحويل بنكي</option>
      <option>شيك</option>
      <option>نقداً</option>
      <option>بوابة دفع إلكتروني</option>
    </select>

    <label>عدد مرات الدفع</label>
    <select id="payment_installments">
      <option value="">اختر...</option>
      <option>دفعة واحدة مقدّمة</option>
      <option>دفعتان (مقدّم + عند التسليم)</option>
      <option>ثلاث دفعات على مراحل التنفيذ</option>
      <option>حسب مراحل التنفيذ بالكامل</option>
    </select>

    <label>ضمان الخدمة</label>
    <textarea id="service_guarantee" rows="2" placeholder="مثال: ضمان استكمال الإجراءات خلال المدة المتفق عليها أو استرجاع جزء من المبلغ"></textarea>

    <label>سياسة الإرجاع/الاسترجاع</label>
    <textarea id="refund_policy" rows="2" placeholder="مثال: استرجاع كامل قبل بدء الإجراءات، لا يوجد استرجاع بعد تقديم الطلب للجهات الحكومية"></textarea>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px;">مستندات إضافية مطلوبة من العميل</h3>
    <textarea id="required_documents" rows="3" placeholder="مثال: عقد التأسيس الأصلي، جواز سفر المدير العام، شهادة عدم ممانعة"></textarea>
  </div>

  <div class="card">
    <h3 style="margin-bottom:14px;">إرفاق ملف PDF إضافي (اختياري)</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">لو عندك عرض تقديمي أو تفاصيل فنية بصيغة PDF جاهزة، ارفعها هنا كإضافة — العرض المنظّم أعلاه سيظهر للعميل بكل الأحوال.</p>
    <input id="pdf_file" type="file" accept="application/pdf">
  </div>

  <button class="btn gold" onclick="submitOffer()">إرسال العرض</button>
  <div id="msg"></div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;
const requestId = new URLSearchParams(window.location.search).get('request_id');

async function init(){
  profile = await requireRole(['provider']);
  if(!profile) return;
  if(!requestId){ document.body.innerHTML = '<p style="padding:40px;text-align:center;">لم يتم تحديد الطلب.</p>'; return; }

  ['acquisition_cost','government_services_cost','licensing_cost','other_costs'].forEach(id => {
    document.getElementById(id).addEventListener('input', updateTotal);
  });
}

function updateTotal(){
  const total = ['acquisition_cost','government_services_cost','licensing_cost','other_costs']
    .reduce((sum, id) => sum + (parseFloat(document.getElementById(id).value) || 0), 0);
  document.getElementById('totalPrice').textContent = total.toLocaleString('ar-SA');
}

async function submitOffer(){
  const msg = document.getElementById('msg');
  const acquisition_cost = parseFloat(document.getElementById('acquisition_cost').value) || 0;
  const government_services_cost = parseFloat(document.getElementById('government_services_cost').value) || 0;
  const licensing_cost = parseFloat(document.getElementById('licensing_cost').value) || 0;
  const other_costs = parseFloat(document.getElementById('other_costs').value) || 0;
  const price = acquisition_cost + government_services_cost + licensing_cost + other_costs;
  const duration_days = document.getElementById('duration_days').value;
  const payment_method = document.getElementById('payment_method').value;
  const payment_installments = document.getElementById('payment_installments').value;
  const service_guarantee = document.getElementById('service_guarantee').value.trim();
  const refund_policy = document.getElementById('refund_policy').value.trim();
  const required_documents = document.getElementById('required_documents').value.trim();

  if(!duration_days || price <= 0){
    msg.className = 'msg err'; msg.textContent = 'الرجاء تعبئة السعر ومدة التنفيذ على الأقل'; return;
  }

  const { data: offerRow, error } = await supabase.from('offers').insert({
    request_id: requestId, provider_id: profile.id,
    price, duration_days,
    acquisition_cost, government_services_cost, licensing_cost, other_costs,
    payment_method, payment_installments, service_guarantee, refund_policy, required_documents
  }).select().single();

  if(error){ msg.className = 'msg err'; msg.textContent = error.message; return; }

  const fileInput = document.getElementById('pdf_file');
  if(fileInput.files.length){
    const file = fileInput.files[0];
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const filePath = `${profile.id}/${offerRow.id}_${safeName}`;
    const { error: upErr } = await supabase.storage.from('offer-attachments').upload(filePath, file);
    if(!upErr){
      await supabase.from('offers').update({ pdf_file_path: filePath }).eq('id', offerRow.id);
    }
  }

  window.location.href = 'dashboard.html';
}

init();
</script>
</body>
</html>
