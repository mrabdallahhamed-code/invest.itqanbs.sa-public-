<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة مقدّم الخدمة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .chat-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;background:var(--cream);}
  .chat-msgs{max-height:200px;overflow-y:auto;margin-bottom:10px;}
  .chat-msg{font-size:13px;padding:6px 10px;border-radius:8px;margin-bottom:6px;max-width:80%;}
  .chat-msg.mine{background:var(--green-tint);margin-right:auto;text-align:left;}
  .chat-msg.theirs{background:var(--white);border:1px solid var(--line);}
  .chat-input-row{display:flex;gap:8px;}
  .chat-input-row input{flex:1;margin:0;padding:8px;}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
  <button class="btn ghost" onclick="signOut()">تسجيل الخروج</button>
</header>
<main>
  <h1 class="page-title">لوحة مقدّم الخدمة</h1>

  <div class="tabs">
    <button class="active" onclick="switchTab('requests')">الطلبات المتاحة</button>
    <button onclick="switchTab('offers')">عروضي ومحادثاتي</button>
    <button onclick="switchTab('docs')">مستنداتي</button>
    <button onclick="switchTab('messages')">رسائل من إتقان</button>
  </div>

  <div id="tab-requests">
    <div class="card">
      <table>
        <thead><tr><th>رقم الطلب</th><th>نوع النشاط</th><th>سنة آخر ميزانية</th><th>إجراء</th></tr></thead>
        <tbody id="reqBody"><tr><td colspan="4">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-offers" style="display:none;">
    <div id="offersArea"><p style="color:var(--ink-soft);font-size:13.5px;">جارٍ التحميل...</p></div>
  </div>

  <div id="tab-docs" style="display:none;">
    <div class="card">
      <h3 style="margin-bottom:10px;">رفع مستند</h3>
      <label>نوع المستند</label>
      <select id="doc_type">
        <option>عقد التأسيس</option>
        <option>السجل التجاري</option>
        <option>الشهادة الضريبية</option>
        <option>العنوان الوطني</option>
      </select>
      <label>الملف</label>
      <input id="doc_file" type="file">
      <button class="btn gold" onclick="uploadProviderDoc()">رفع المستند</button>
      <div id="uploadMsg"></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px;">مستنداتي المرفوعة</h3>
      <table>
        <thead><tr><th>النوع</th><th>تاريخ الرفع</th><th>الحالة</th></tr></thead>
        <tbody id="docsBody"><tr><td colspan="3">جارٍ التحميل...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div id="tab-messages" style="display:none;">
    <div class="card">
      <h3 style="margin-bottom:10px;">رسائل من فريق إتقان</h3>
      <div id="adminMsgsList"><p style="font-size:13px;color:var(--ink-soft);">جارٍ التحميل...</p></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <input id="adminMsgInput" placeholder="اكتب ردّك هنا...">
        <button class="btn" style="margin:0;padding:10px 18px;" onclick="sendAdminMsg()">إرسال</button>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

function switchTab(tab){
  document.getElementById('tab-requests').style.display = tab==='requests' ? 'block':'none';
  document.getElementById('tab-offers').style.display = tab==='offers' ? 'block':'none';
  document.getElementById('tab-docs').style.display = tab==='docs' ? 'block':'none';
  document.getElementById('tab-messages').style.display = tab==='messages' ? 'block':'none';
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(tab==='offers') loadOffers();
  if(tab==='docs') loadProviderDocs();
  if(tab==='messages') loadAdminMsgs();
}

async function loadAdminMsgs(){
  const { data, error } = await supabase.from('admin_messages').select('*').eq('recipient_id', profile.id).order('created_at');
  const list = document.getElementById('adminMsgsList');
  if(error){ list.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!data || !data.length){ list.innerHTML = '<p style="font-size:13px;color:var(--ink-soft);">لا توجد رسائل حتى الآن.</p>'; return; }
  list.innerHTML = data.map(m => `<div class="chat-msg ${m.sender_id===profile.id?'mine':'theirs'}">${m.message}</div>`).join('');
}

async function sendAdminMsg(){
  const input = document.getElementById('adminMsgInput');
  const text = input.value.trim();
  if(!text) return;
  const { data: admins } = await supabase.from('profiles').select('id').eq('role','admin').limit(1);
  if(!admins || !admins.length){ alert('تعذر تحديد جهة الإدارة'); return; }
  const { error } = await supabase.from('admin_messages').insert({ recipient_id: admins[0].id, sender_id: profile.id, message: text });
  if(error){ alert(error.message); return; }
  input.value = '';
  loadAdminMsgs();
}

async function init(){
  profile = await requireRole(['provider']);
  if(!profile) return;
  loadRequests();
}

async function loadRequests(){
  const { data, error } = await supabase
    .from('service_requests')
    .select('id, created_at, activity_type, last_audited_budget')
    .eq('status', 'open')
    .order('created_at', {ascending:false});

  const body = document.getElementById('reqBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="4">لا توجد طلبات مفتوحة حالياً</td></tr>'; return; }

  body.innerHTML = data.map(r => `
    <tr>
      <td>#${r.id.slice(0,8)}</td>
      <td>${r.activity_type || '—'}</td>
      <td>${r.last_audited_budget || '—'}</td>
      <td>
        <input type="number" placeholder="السعر" id="price-${r.id}" style="width:90px;display:inline-block;padding:6px;">
        <input type="number" placeholder="أيام" id="days-${r.id}" style="width:70px;display:inline-block;padding:6px;">
        <button class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="submitOffer('${r.id}')">إرسال عرض</button>
      </td>
    </tr>`).join('');
}

async function submitOffer(requestId){
  const price = document.getElementById(`price-${requestId}`).value;
  const days = document.getElementById(`days-${requestId}`).value;
  if(!price || !days){ alert('أدخل السعر ومدة التنفيذ'); return; }

  const { error } = await supabase.from('offers').insert({
    request_id: requestId, provider_id: profile.id, price, duration_days: days
  });
  if(error){ alert(error.message); return; }
  alert('تم إرسال العرض');
}

async function loadOffers(){
  const area = document.getElementById('offersArea');
  const { data, error } = await supabase
    .from('offers')
    .select('id, price, duration_days, status, request_id, service_requests(activity_type)')
    .eq('provider_id', profile.id)
    .order('created_at', {ascending:false});

  if(error || !data || !data.length){ area.innerHTML = '<p style="color:var(--ink-soft);font-size:13.5px;">لم تقدّم أي عروض بعد.</p>'; return; }

  const statusMap = {submitted:'مُرسَل', accepted:'مقبول ✓', rejected:'مرفوض'};
  area.innerHTML = data.map(o => `
    <div class="card">
      <p style="font-size:14px;font-weight:700;margin-bottom:4px;">طلب #${o.request_id.slice(0,8)} — ${o.service_requests?.activity_type || ''}</p>
      <p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">السعر: ${o.price} ر.س · المدة: ${o.duration_days} يوم · الحالة: ${statusMap[o.status]}</p>
      <button class="btn ghost" style="padding:7px 14px;font-size:12.5px;margin-top:0;" onclick="toggleChat('${o.id}')">فتح المحادثة</button>
      ${o.status === 'accepted' ? `<button class="btn ghost" style="padding:7px 14px;font-size:12.5px;margin-top:0;" onclick="toggleStages('${o.id}','${o.request_id}')">متابعة المراحل</button>` : ''}
      <div id="chat-${o.id}" style="display:none;"></div>
      ${o.status === 'accepted' ? `<div id="stages-${o.id}" style="display:none;margin-top:10px;"></div>` : ''}
    </div>
  `).join('');
}

function toggleStages(offerId, requestId){
  const el = document.getElementById(`stages-${offerId}`);
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(isHidden){ el.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">جارٍ التحميل...</p>'; loadStages(requestId, `stages-${offerId}`, true); }
}

async function loadStages(requestId, containerId, canEdit){
  const container = document.getElementById(containerId);
  const { data: req } = await supabase.from('service_requests').select('id, created_at, status, client_id').eq('id', requestId).single();
  const { data: offersData } = await supabase.from('offers').select('created_at, status').eq('request_id', requestId).order('created_at');
  const { data: clientRow } = await supabase.from('clients').select('created_at, assessment_completed_at').eq('id', req.client_id).single();

  const autoStages = [
    { name:'تم التسجيل', done:true, date: clientRow?.created_at },
    { name:'تم اعتماد طلبه', done: !!clientRow?.assessment_completed_at, date: clientRow?.assessment_completed_at },
    { name:'تم الرفع للعروض', done: req.status !== 'pending_admin_review', date: req.created_at },
    { name:'تم إرسال عروض', done: !!(offersData && offersData.length), date: offersData?.[0]?.created_at },
    { name:'اعتماد العروض', done: !!(offersData && offersData.some(o=>o.status==='accepted')), date: offersData?.find(o=>o.status==='accepted')?.created_at },
  ];

  const { data: stages } = await supabase.from('request_stages').select('*').eq('request_id', requestId).order('stage_order');

  let html = '<div class="timeline">';
  autoStages.forEach(s => {
    html += `<div class="tl-item ${s.done?'done':''}"><span class="tl-dot"></span><div class="tl-text"><strong>${s.name}</strong>${s.date?` <span class="tl-date">${new Date(s.date).toLocaleDateString('ar-SA')}</span>`:''}</div></div>`;
  });
  if(stages && stages.length){
    stages.forEach(s => {
      const cls = s.status === 'completed' ? 'done' : (s.status==='in_progress' ? 'active' : '');
      let actionBtn = '';
      if(canEdit && s.status !== 'completed'){
        if(s.status === 'pending') actionBtn = `<button class="btn ghost" style="padding:5px 10px;font-size:11px;margin-top:4px;" onclick="updateStage('${s.id}','in_progress','${requestId}','${containerId}',${canEdit})">بدء المرحلة</button>`;
        else actionBtn = `<button class="btn" style="padding:5px 10px;font-size:11px;margin-top:4px;" onclick="updateStage('${s.id}','completed','${requestId}','${containerId}',${canEdit})">إنهاء المرحلة</button>`;
      }
      html += `<div class="tl-item ${cls}"><span class="tl-dot"></span><div class="tl-text"><strong>${s.stage_name}</strong>${s.completed_at?` <span class="tl-date">${new Date(s.completed_at).toLocaleDateString('ar-SA')}</span>`:''}<br>${actionBtn}</div></div>`;
    });
  } else {
    html += '<p style="font-size:12px;color:var(--ink-soft);">لم تبدأ مراحل التنفيذ بعد.</p>';
  }
  html += '</div>';
  container.innerHTML = html;
}

async function updateStage(stageId, newStatus, requestId, containerId, canEdit){
  const payload = { status: newStatus };
  if(newStatus==='in_progress') payload.started_at = new Date().toISOString();
  if(newStatus==='completed') payload.completed_at = new Date().toISOString();
  const { error } = await supabase.from('request_stages').update(payload).eq('id', stageId);
  if(error){ alert(error.message); return; }
  loadStages(requestId, containerId, canEdit);
}

function toggleChat(offerId){
  const el = document.getElementById(`chat-${offerId}`);
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(isHidden) renderChat(offerId);
}

async function renderChat(offerId){
  const el = document.getElementById(`chat-${offerId}`);
  el.innerHTML = `<div class="chat-box"><div class="chat-msgs" id="msgs-${offerId}">جارٍ التحميل...</div>
    <div class="chat-input-row"><input id="input-${offerId}" placeholder="اكتب رسالة..."><button class="btn" style="margin:0;padding:8px 16px;" onclick="sendMessage('${offerId}')">إرسال</button></div></div>`;
  loadMessages(offerId);
}

async function loadMessages(offerId){
  const { data, error } = await supabase.from('messages').select('*').eq('offer_id', offerId).order('created_at');
  const box = document.getElementById(`msgs-${offerId}`);
  if(error){ box.innerHTML = `<p class="msg err">${error.message}</p>`; return; }
  if(!data || !data.length){ box.innerHTML = '<p style="font-size:12.5px;color:var(--ink-soft);">لا توجد رسائل بعد.</p>'; return; }
  box.innerHTML = data.map(m => `<div class="chat-msg ${m.sender_id === profile.id ? 'mine' : 'theirs'}">${m.message}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(offerId){
  const input = document.getElementById(`input-${offerId}`);
  const text = input.value.trim();
  if(!text) return;
  const { error } = await supabase.from('messages').insert({ offer_id: offerId, sender_id: profile.id, message: text });
  if(error){ alert(error.message); return; }
  input.value = '';
  loadMessages(offerId);
}

async function uploadProviderDoc(){
  const fileInput = document.getElementById('doc_file');
  const doc_type = document.getElementById('doc_type').value;
  const msg = document.getElementById('uploadMsg');
  if(!fileInput.files.length){ msg.className='msg err'; msg.textContent='اختر ملفاً أولاً'; return; }

  const file = fileInput.files[0];
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  const filePath = `${profile.id}/${Date.now()}_${safeName}`;

  const { error: upErr } = await supabase.storage.from('provider-documents').upload(filePath, file);
  if(upErr){ msg.className='msg err'; msg.textContent = upErr.message; return; }

  const { error: dbErr } = await supabase.from('provider_documents').insert({
    provider_id: profile.id, doc_type, file_path: filePath
  });
  if(dbErr){ msg.className='msg err'; msg.textContent = dbErr.message; return; }

  msg.className='msg ok'; msg.textContent='تم رفع المستند بنجاح';
  fileInput.value = '';
  loadProviderDocs();
}

async function loadProviderDocs(){
  const { data, error } = await supabase.from('provider_documents').select('*').eq('provider_id', profile.id).order('uploaded_at', {ascending:false});
  const body = document.getElementById('docsBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="3">لا توجد مستندات مرفوعة بعد</td></tr>'; return; }
  const statusMap = {pending:'<span class="badge pending">قيد المراجعة</span>', verified:'<span class="badge ready">تم التحقق</span>', rejected:'<span class="badge notready">مرفوض</span>'};
  body.innerHTML = data.map(d => `<tr><td>${d.doc_type}</td><td>${new Date(d.uploaded_at).toLocaleDateString('ar-SA')}</td><td>${statusMap[d.status]}</td></tr>`).join('');
}

init();
</script>
</body>
</html>
