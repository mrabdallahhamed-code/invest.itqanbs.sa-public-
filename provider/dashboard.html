<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة مقدّم الخدمة — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
  <button class="btn ghost" onclick="signOut()">تسجيل الخروج</button>
</header>
<main>
  <h1 class="page-title">طلبات العملاء</h1>

  <div class="card">
    <table>
      <thead><tr><th>رقم الطلب</th><th>نوع النشاط</th><th>الميزانية</th><th>الجدول الزمني</th><th>إجراء</th></tr></thead>
      <tbody id="reqBody"><tr><td colspan="5">جارٍ التحميل...</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h3 style="margin-bottom:10px;">عروضي المُقدَّمة</h3>
    <table>
      <thead><tr><th>الطلب</th><th>السعر</th><th>مدة التنفيذ</th><th>الحالة</th></tr></thead>
      <tbody id="offersBody"><tr><td colspan="4">جارٍ التحميل...</td></tr></tbody>
    </table>
  </div>
</main>

<script src="../assets/js/supabaseClient.js"></script>
<script>
let profile;

async function init(){
  profile = await requireRole(['provider']);
  if(!profile) return;
  loadRequests();
  loadOffers();
}

async function loadRequests(){
  const { data, error } = await supabase
    .from('service_requests')
    .select('id, created_at, activity_type, budget_range, timeline')
    .eq('status', 'open')
    .order('created_at', {ascending:false});

  const body = document.getElementById('reqBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="5">لا توجد طلبات مفتوحة حالياً</td></tr>'; return; }

  body.innerHTML = data.map(r => `
    <tr>
      <td>#${r.id.slice(0,8)}</td>
      <td>${r.activity_type || '—'}</td>
      <td>${r.budget_range || '—'}</td>
      <td>${r.timeline || '—'}</td>
      <td>
        <input type="number" placeholder="السعر (ر.س)" id="price-${r.id}" style="width:100px;display:inline-block;padding:6px;">
        <input type="number" placeholder="أيام" id="days-${r.id}" style="width:80px;display:inline-block;padding:6px;">
        <button class="btn" style="padding:6px 12px;font-size:12px;margin-top:0;" onclick="submitOffer('${r.id}')">إرسال عرض</button>
      </td>
    </tr>`).join('');
}

async function submitOffer(requestId){
  const price = document.getElementById(`price-${requestId}`).value;
  const days = document.getElementById(`days-${requestId}`).value;
  if(!price || !days){ alert('أدخل السعر ومدة التنفيذ'); return; }

  const { error } = await supabase.from('offers').insert({
    request_id: requestId, provider_id: profile.id, price, duration_days: days
  });
  if(error){ alert(error.message); return; }
  alert('تم إرسال العرض');
  loadOffers();
}

async function loadOffers(){
  const { data, error } = await supabase
    .from('offers')
    .select('id, price, duration_days, status, request_id')
    .eq('provider_id', profile.id)
    .order('created_at', {ascending:false});

  const body = document.getElementById('offersBody');
  if(error || !data || !data.length){ body.innerHTML = '<tr><td colspan="4">لم تقدّم أي عروض بعد</td></tr>'; return; }

  const statusMap = {submitted:'مُرسَل', accepted:'مقبول ✓', rejected:'مرفوض'};
  body.innerHTML = data.map(o => `
    <tr><td>#${o.request_id.slice(0,8)}</td><td>${o.price} ر.س</td><td>${o.duration_days} يوم</td><td>${statusMap[o.status]}</td></tr>
  `).join('');
}

init();
</script>
</body>
</html>
