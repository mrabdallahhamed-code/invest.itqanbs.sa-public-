<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top"><div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div></header>
<main style="max-width:480px;">
  <h1 class="page-title">تسجيل الدخول</h1>
  <div class="card">
    <label>البريد الإلكتروني</label>
    <input id="email" type="email">
    <label>كلمة المرور</label>
    <input id="password" type="password">
    <button class="btn" onclick="login()">دخول</button>
    <div id="msg"></div>
    <p style="margin-top:16px;font-size:13px;">ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
  </div>
</main>
<script src="../assets/js/supabaseClient.js"></script>
<script>
async function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }

  const profile = await getCurrentProfile();
  if(!profile){ msg.className='msg err'; msg.textContent='تعذر جلب بيانات الحساب'; return; }

  if(profile.role === 'admin') window.location.href = '../admin/dashboard.html';
  else if(profile.role === 'provider') window.location.href = '../provider/dashboard.html';
  else window.location.href = '../client/dashboard.html';
}
</script>
</body>
</html>
