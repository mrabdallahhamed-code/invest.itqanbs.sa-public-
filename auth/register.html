<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — إتقان</title>
<link rel="stylesheet" href="../assets/css/itqan.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  #langToggleBtn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:11px;font-weight:800;cursor:pointer;color:var(--green-dark);letter-spacing:.5px;}
  #langToggleBtn:hover{border-color:var(--gold);color:var(--gold-deep);}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="../assets/images/logo.jpeg" alt="إتقان"></div>
  <button id="langToggleBtn" onclick="toggleLang()">EN</button>
</header>
<main style="max-width:480px;">
  <h1 class="page-title" data-i18n="register_title">إنشاء حساب جديد</h1>
  <div class="card">
    <label data-i18n="register_role">نوع الحساب</label>
    <select id="role">
      <option value="client" data-i18n="register_role_client">عميل (مستثمر)</option>
      <option value="provider" data-i18n="register_role_provider">مقدّم خدمة</option>
    </select>
    <label data-i18n="register_fullname">الاسم الكامل</label>
    <input id="full_name" type="text" placeholder="اسمك الثلاثي أو اسم الشركة">
    <label data-i18n="register_email">البريد الإلكتروني</label>
    <input id="email" type="email" placeholder="you@example.com">
    <label data-i18n="register_phone">رقم الجوال (مع رمز الدولة)</label>
    <input id="contact_phone" type="tel" placeholder="مثال: 966501234567+">
    <label data-i18n="register_preferred_contact">الوسيلة المفضلة للتواصل</label>
    <select id="preferred_contact">
      <option value="email" data-i18n="register_contact_email">البريد الإلكتروني</option>
      <option value="whatsapp" data-i18n="register_contact_whatsapp">واتساب</option>
    </select>
    <label data-i18n="register_password">كلمة المرور</label>
    <input id="password" type="password" placeholder="8 أحرف على الأقل">
    <button class="btn" onclick="register()" data-i18n="register_btn">إنشاء الحساب</button>
    <div id="msg"></div>
    <p style="margin-top:16px;font-size:13px;"><span data-i18n="register_have_account">لديك حساب؟</span> <a href="login.html" data-i18n="register_login_link">تسجيل الدخول</a></p>
  </div>
</main>
<script src="../assets/js/supabaseClient.js"></script>
<script src="../assets/js/i18n.js"></script>
<script>
const urlRole = new URLSearchParams(window.location.search).get('role');
if(urlRole === 'client' || urlRole === 'provider'){ document.getElementById('role').value = urlRole; }

async function register(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const full_name = document.getElementById('full_name').value.trim();
  const role = document.getElementById('role').value;
  const contact_phone = document.getElementById('contact_phone').value.trim();
  const preferred_contact = document.getElementById('preferred_contact').value;
  const preferred_language = getLang();
  const msg = document.getElementById('msg');
  msg.className = 'msg'; msg.textContent = '';

  if(!email || !password || !full_name){
    msg.className='msg err'; msg.textContent='الرجاء تعبئة كل الحقول'; return;
  }

  const { data, error } = await supabase.auth.signUp({ email, password });
  if(error){ msg.className='msg err'; msg.textContent = error.message; return; }

  const userId = data.user.id;
  const { error: profErr } = await supabase.from('profiles').insert({ id: userId, full_name, role, contact_phone, preferred_contact, preferred_language });
  if(profErr){ msg.className='msg err'; msg.textContent = profErr.message; return; }

  if(role === 'client'){
    await supabase.from('clients').insert({ id: userId });
  } else {
    await supabase.from('service_providers').insert({ id: userId, company_name: full_name });
  }

  msg.className='msg ok';
  msg.textContent='تم إنشاء الحساب! تحقق من بريدك لتأكيد الحساب ثم سجّل الدخول.';
}
</script>
</body>
</html>
